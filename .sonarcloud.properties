# Les feuilles de style du projet sont du CSS JavaFX : ses pseudo-classes (:focused, :selected...)
# ne sont pas des pseudo-classes W3C. La règle css:S4659 n'a pas de sens ici, on l'ignore pour les .css.
sonar.issue.ignore.multicriteria=javafxPseudoClasses
sonar.issue.ignore.multicriteria.javafxPseudoClasses.ruleKey=css:S4659
sonar.issue.ignore.multicriteria.javafxPseudoClasses.resourceKey=**/*.css
sonar.exclusions=**/*.css