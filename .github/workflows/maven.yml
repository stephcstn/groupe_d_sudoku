# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: CI Sudoku (Docker Test Runner)

on:
  push:
    branches: [ "**" ]  # S'applique à toutes les branches de travail
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Build et tests dans Docker
        run: docker build -t sudoku-ci .

      - name: Extraire le JAR
        run: |
          docker create --name temp-container sudoku-ci
          docker cp temp-container:/target .
          docker rm temp-container

      - name: Mettre à disposition le JAR
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-application-jar
          path: target/*.jar
